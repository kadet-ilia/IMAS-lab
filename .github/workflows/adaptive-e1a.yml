name: E1-A adaptive research (test branch)
on:
  push:
    branches: [IMAS_Lab_test]
    paths:
      - 'gui/**'
      - 'tests/**'
      - '.github/workflows/adaptive-e1a.yml'
  pull_request:
    branches: [IMAS_Lab_test]
    paths:
      - 'gui/**'
      - 'tests/**'
      - '.github/workflows/adaptive-e1a.yml'
permissions:
  contents: read
concurrency:
  group: imas-e1a-test-branch
  cancel-in-progress: true
jobs:
  adaptive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: gui/package-lock.json
      - name: Install reproducible dependencies
        working-directory: gui
        run: npm ci
      - name: Run all JavaScript scientific regressions
        working-directory: gui
        run: npm test
      - name: Compile production frontend
        working-directory: gui
        run: npm run build
      - name: Exploratory E1-A pilot (not confirmatory)
        working-directory: gui
        run: npm run adaptive:pilot
      - name: Protocol-locked campaign smoke (3 x 2 paired seeds)
        working-directory: gui
        run: npm run adaptive:campaign:smoke
      - name: Online risk-controller causal regression smoke
        working-directory: gui
        run: |
          npm run adaptive:risk:design
          npm run adaptive:risk:smoke
      - name: Network feedback reachability and delivery pilot
        working-directory: gui
        run: npm run adaptive:network:pilot
      - name: Shared-budget routed feedback pilot (16 cells)
        working-directory: gui
        run: npm run adaptive:routed:pilot
      - name: Two-way shared-bandwidth scheduler pilot (16 cells)
        working-directory: gui
        run: npm run adaptive:scheduler:pilot
      - name: Demand-capped local bandwidth fairness pilot (24 cells, 3 seeds each)
        working-directory: gui
        run: npm run adaptive:fair:pilot
      - name: Component-local ideal synchronous consensus diagnostic pilot (12 cells)
        working-directory: gui
        run: npm run adaptive:local:pilot
      - name: Causal local-neighbor delayed delivery and idle E1 slot pilot (16 cells)
        working-directory: gui
        run: npm run adaptive:local:transport:pilot
      - name: Independent directed-trust local-decision shadow pilot (16 cells)
        working-directory: gui
        run: npm run adaptive:local:autonomy:pilot
      - name: Directed-trust local quarantine / readmission pilot (16 cells)
        working-directory: gui
        run: npm run adaptive:local:guard:pilot
      - name: Bounded causal local action feedback research pilot (16 cells)
        working-directory: gui
        run: npm run adaptive:local:action:pilot
      - name: Closed scalar plant, trusted measurement barrier and 3-controller pilot (24 cells)
        working-directory: gui
        run: npm run adaptive:local:plant:pilot
      - name: Set-valued observer and sensor dropout/degradation pilot (24 cells, 72 runs)
        working-directory: gui
        run: npm run adaptive:local:sensor:pilot
      - name: Causal authenticated physical cross-sensor pilot (72 episodes)
        working-directory: gui
        run: npm run adaptive:local:cross:pilot
      - name: Geometric remote-sensor observability range pilot (96 synthetic episodes)
        working-directory: gui
        run: npm run adaptive:local:geometry:pilot
      - name: Protocol-locked internal synthetic cross-geometry holdout (32 pairs and controls)
        working-directory: gui
        run: npm run adaptive:local:geometry:holdout
      - name: Time-varying orbital occlusion, time ambiguity and pointing pilot (120 episodes)
        working-directory: gui
        run: npm run adaptive:local:orbital:pilot
      - name: Export exploratory pilot data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: imas-e1a-adaptive-pilot
          path: gui/adaptive-results/
          if-no-files-found: warn
          retention-days: 14
      - name: Browser UI verification
        working-directory: gui
        run: |
          npm run preview > /tmp/imas-e1a-preview.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173 >/dev/null; then break; fi
            sleep 1
          done
          npm run verify
