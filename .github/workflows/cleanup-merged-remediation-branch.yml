name: Delete merged source branch (temporary)
on:
  push:
    branches:
      - IMAS_LaB_test
permissions:
  contents: write
jobs:
  remove-merged-pr-3-branch:
    if: github.repository == 'kadet-ilia/IMAS-lab'
    runs-on: ubuntu-latest
    steps:
      - name: Delete only the merged and unchanged remediation ref
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          merged="$(gh api "repos/${GH_REPO}/pulls/3" --jq '.merged')"
          if [[ "${merged}" != "true" ]]; then
            echo "Pull request #3 has not merged; no source branch deletion."
            exit 0
          fi
          merged_head="$(gh api "repos/${GH_REPO}/pulls/3" --jq '.head.sha')"
          current_head="$(gh api "repos/${GH_REPO}/git/ref/heads/remediation/imas-lab-scientific-integrity" --jq '.object.sha' 2>/dev/null || true)"
          if [[ -z "${current_head}" ]]; then
            echo "Source branch already deleted."
            exit 0
          fi
          if [[ "${current_head}" != "${merged_head}" ]]; then
            echo "::error::Source branch advanced after PR #3 was merged; refusing to delete."
            exit 1
          fi
          gh api --method DELETE "repos/${GH_REPO}/git/refs/heads/remediation/imas-lab-scientific-integrity"
          echo "Removed the fully merged source branch."
