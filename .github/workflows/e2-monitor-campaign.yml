name: E2 monitoring and statistical pilot (384 configurations)
on:
  push:
    branches: [IMAS_Lab_test]
    paths:
      - 'gui/scripts/e2-monitor-campaign.mjs'
      - '.github/workflows/e2-monitor-campaign.yml'
  workflow_dispatch:
jobs:
  campaign:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run three 128-configuration experiments
        working-directory: gui
        run: node scripts/e2-monitor-campaign.mjs monitor-campaign
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2-monitor-campaign-evidence
          path: gui/monitor-campaign/
          retention-days: 90
