name: E2 prospective rule confirmation (512 configurations)
on:
  push:
    branches: [IMAS_Lab_test]
    paths:
      - 'gui/scripts/e2-pattern-campaign.mjs'
      - 'gui/src/automaticDecisions/patternAnalysis.js'
      - '.github/workflows/e2-pattern-campaign.yml'
  workflow_dispatch:
jobs:
  campaign:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run discovery then prospective confirmation
        working-directory: gui
        run: node scripts/e2-pattern-campaign.mjs pattern-campaign
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2-pattern-evidence
          path: gui/pattern-campaign/
          retention-days: 90
