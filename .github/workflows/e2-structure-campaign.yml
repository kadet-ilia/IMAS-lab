name: E2 structure and regrouping pilot (256 configurations)
on:
  push:
    branches: [IMAS_Lab_test]
    paths:
      - 'gui/scripts/e2-structure-campaign.mjs'
      - '.github/workflows/e2-structure-campaign.yml'
  workflow_dispatch:
jobs:
  campaign:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run paired structure pilot
        working-directory: gui
        run: node scripts/e2-structure-campaign.mjs structure-campaign
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2-structure-evidence
          path: gui/structure-campaign/
          retention-days: 90
