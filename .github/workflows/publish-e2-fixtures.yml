name: Publish validated E2 static fixtures (test branch only)
on:
  push:
    branches: [IMAS_Lab_test]
    paths:
      - '.github/workflows/publish-e2-fixtures.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publish:
    if: github.ref == 'refs/heads/IMAS_Lab_test'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: IMAS_Lab_test
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: imas-e2-reproducibility
          run-id: 45783221656
          github-token: ${{ github.token }}
          path: /tmp/imas-e2-validated
      - name: Stage the validated primary inputs
        run: |
          source=$(find /tmp/imas-e2-validated -name e2-fixtures.json -type f)
          test -f "$source"
          mkdir -p gui/public
          cp "$source" gui/public/e2-fixtures.json
          sha256sum gui/public/e2-fixtures.json | cut -d ' ' -f 1 > gui/public/e2-fixtures.sha256
          cd gui
          npm ci
          npm run e2:assets
          npm run build
          cmp public/e2-fixtures.json dist/e2-fixtures.json
          cmp public/e2-fixtures.sha256 dist/e2-fixtures.sha256
      - name: Commit only the two verified static assets to the test branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gui/public/e2-fixtures.json gui/public/e2-fixtures.sha256
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix(E2): ship validated article fixtures and SHA-256"
          git push origin HEAD:refs/heads/IMAS_Lab_test
