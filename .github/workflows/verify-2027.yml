name: Verify IMAS_Lab (browser-only)
on:
  push:
    branches:
      - 'IMAS_Lab'
      - 'IMAS_Lab_test'
    paths:
      - 'gui/**'
      - 'research/automatic-decisions/**'
      - 'README.md'
      - 'experiment.py'
      - 'validate_external_calibration.py'
      - 'scientific_release_gate.py'
      - 'test_*.py'
      - 'requirements.txt'
      - '.github/workflows/verify-2027.yml'
      - 'audit/scientific-integrity/**'
  pull_request:
    paths:
      - 'gui/**'
      - 'research/automatic-decisions/**'
      - 'README.md'
      - 'experiment.py'
      - 'validate_external_calibration.py'
      - 'scientific_release_gate.py'
      - 'test_*.py'
      - 'requirements.txt'
      - 'audit/scientific-integrity/**'
      - '.gitignore'
      - 'test_repository_hygiene.py'
      - 'test_encoding.py'
      - 'encoding_audit.py'
      - '.github/workflows/verify-2027.yml'
  workflow_dispatch:
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: gui/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r research/automatic-decisions/reference/requirements.txt
      - run: npm ci
        working-directory: gui
      - run: npm run test
        working-directory: gui
      - run: npm run e2:fixtures
        working-directory: gui
      - run: npm run build
        working-directory: gui
      - run: npm run test
        working-directory: gui
      - name: Browser smoke test
        working-directory: gui
        run: |
          npm run preview > /tmp/imas-preview.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173 >/dev/null && break || sleep 1; done
          npm run verify
      - name: Upload browser verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: imas-remediation-browser-evidence
          path: |
            gui/verification.json
            gui/dashboard.png
            gui/stability.png
            gui/help.png
            gui/research2027.png
          if-no-files-found: warn
          retention-days: 14
  e2-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r research/automatic-decisions/reference/requirements.txt
      - run: python research/automatic-decisions/reference/experiment.py
        env:
          OPENBLAS_NUM_THREADS: '1'
      - run: python research/automatic-decisions/reference/extra_checks.py
        env:
          OPENBLAS_NUM_THREADS: '1'
      - run: npm run e2:fixtures
        working-directory: gui
        env:
          OPENBLAS_NUM_THREADS: '1'
      - run: npm run e2:parity
        working-directory: gui
      - name: Independent extended model reference (SciPy LP)
        working-directory: gui
        run: node scripts/check-e2-extended.mjs
      - name: Exact rational interaction reference
        run: python research/automatic-decisions/reference/interaction_reference.py
      - name: Independent E2 dynamic, Bayesian and partial-data reference
        working-directory: gui
        run: node scripts/check-e2-next.mjs e2-next-verification.json
      - name: External CSV adapter tests
        working-directory: research/automatic-decisions/reference
        run: python -m unittest -v test_convert_external_csv
      - name: Independent E2 late reference (LP, rational DP, statistical tests)
        working-directory: gui
        run: node scripts/check-e2-late.mjs e2-late-verification.json
      - name: Measure isolated process memory
        working-directory: gui
        run: node scripts/measure-e2-memory.mjs e2-memory.json
      - uses: actions/upload-artifact@v4
        with:
          name: imas-e2-reproducibility
          path: |
            gui/public/e2-fixtures.json
            research/automatic-decisions/reference/*.csv
            research/automatic-decisions/reference/checks.txt
            gui/e2-next-verification.json
            gui/e2-late-verification.json
            gui/e2-memory.json
  existing-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      - name: Cross-language independent reference and legacy Python regressions
        run: python -m unittest -v test_experiment test_encoding test_repository_hygiene test_primitive_parity test_up34_deterministic test_up34_network_trace test_up34_research_raw test_up34_graph_and_marking test_external_calibration test_scientific_release_gate test_legacy_divergences
      - name: UP-36 evidence-readiness report (not scientific acceptance)
        run: python scientific_release_gate.py --output acceptance-readiness.json
      - name: Upload fail-closed scientific acceptance blockers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: imas-up36-acceptance-readiness
          path: acceptance-readiness.json
          if-no-files-found: warn
          retention-days: 14
