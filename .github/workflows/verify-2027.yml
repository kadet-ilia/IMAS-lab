name: Verify IMAS_Lab (frontend, browser and Python)
on:
  push:
    branches:
      - 'IMAS_Lab'
      - 'IMAS_Lab_test'
    paths:
      - 'gui/**'
      - 'README.md'
      - 'experiment.py'
      - 'validate_external_calibration.py'
      - 'scientific_release_gate.py'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/verify-2027.yml'
      - 'audit/scientific-integrity/**'
  pull_request:
    paths:
      - 'gui/**'
      - 'README.md'
      - 'experiment.py'
      - 'validate_external_calibration.py'
      - 'scientific_release_gate.py'
      - 'tests/**'
      - 'requirements.txt'
      - 'audit/scientific-integrity/**'
      - '.gitignore'

      - 'encoding_audit.py'
      - '.github/workflows/verify-2027.yml'
  workflow_dispatch:
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: gui/package-lock.json
      - run: npm ci
        working-directory: gui
      - run: npm run test
        working-directory: gui
      - run: npm run build
        working-directory: gui
      - name: Validate compiled Cloudflare SPA and worker assets
        working-directory: gui
        env:
          IMAS_EXPECT_BUILD: '1'
        run: npm run test:hosting:built
      - name: Browser smoke test
        working-directory: gui
        run: |
          npm run preview > /tmp/imas-preview.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173 >/dev/null && break || sleep 1; done
          npm run verify
      - name: Upload browser verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: imas-remediation-browser-evidence
          path: |
            gui/verification.json
            gui/dashboard.png
            gui/stability.png
            gui/help.png
            gui/research2027.png
          if-no-files-found: warn
          retention-days: 14
  existing-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      - name: Cross-language independent reference and legacy Python regressions
        run: python -m unittest discover -s tests/python -p "test_*.py" -v
      - name: UP-36 evidence-readiness report (not scientific acceptance)
        run: python scientific_release_gate.py --output acceptance-readiness.json
      - name: Upload fail-closed scientific acceptance blockers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: imas-up36-acceptance-readiness
          path: acceptance-readiness.json
          if-no-files-found: warn
          retention-days: 14
