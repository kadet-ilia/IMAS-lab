name: Verify IMAS_LaB_test (browser-only)
on:
  push:
    branches:
      - 'IMAS_LaB_test'
      - 'remediation/imas-lab-scientific-integrity'
    paths:
      - 'gui/**'
      - 'README.md'
      - 'experiment.py'
      - 'test_*.py'
      - 'requirements.txt'
      - '.github/workflows/verify-2027.yml'
      - 'audit/remediation/**'
  pull_request:
    paths:
      - 'gui/**'
      - 'README.md'
      - 'experiment.py'
      - 'test_*.py'
      - 'requirements.txt'
      - 'audit/remediation/**'
      - '.gitignore'
      - 'test_repository_hygiene.py'
      - 'test_encoding.py'
      - 'encoding_audit.py'
      - '.github/workflows/verify-2027.yml'
  workflow_dispatch:
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: gui/package-lock.json
      - run: npm ci
        working-directory: gui
      - run: npm run test
        working-directory: gui
      - run: npm run build
        working-directory: gui
      - run: npm run test
        working-directory: gui
      - name: Browser smoke test
        working-directory: gui
        run: |
          npm run preview > /tmp/imas-preview.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173 >/dev/null && break || sleep 1; done
          npm run verify
      - name: Upload browser verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: imas-remediation-browser-evidence
          path: |
            gui/verification.json
            gui/dashboard.png
            gui/help.png
            gui/research2027.png
          if-no-files-found: warn
          retention-days: 14
  existing-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      - name: Cross-language independent reference and legacy Python regressions
        run: python -m unittest -v test_experiment test_encoding test_repository_hygiene test_primitive_parity test_up34_deterministic test_up34_network_trace test_up34_research_raw test_legacy_divergences